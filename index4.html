<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Professores</title>
    <!-- Fonte Inter para tipografia moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        /* Layout em Grelha para os Formulários */
        .forms-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 840px) {
            .forms-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            padding: 1.75rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .card-header-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            background-color: #fafafa;
        }

        input:focus {
            background-color: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        .btn-cancel:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        /* Lista de Professores */
        .list-section h2 {
            margin-bottom: 1rem;
        }

        .professor-card {
            background: var(--surface);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-md);
            margin-bottom: 0.85rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .professor-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .professor-info-block {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .professor-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-id {
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .professor-details {
            display: flex;
            gap: 1.25rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .professor-details span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            width: auto;
            padding: 0.45rem 0.85rem;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .btn-edit {
            background-color: #fffbeb;
            color: var(--warning-hover);
            border: 1px solid #fde68a;
        }

        .btn-edit:hover {
            background-color: var(--warning);
            color: white;
        }

        .btn-delete {
            background-color: #fef2f2;
            color: var(--danger-hover);
            border: 1px solid #fecaca;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .resultado-busca {
            margin-top: 1.25rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border);
        }
    </style>
</head>

<body>

    <div class="app-container">
        <header>
            <h1>Gerenciamento de Professores</h1>
            <p>Painel de controlo e administração de docentes</p>
        </header>

        <div class="forms-grid">
            <!-- Formulário de Cadastro e Edição (POST / PUT) -->
            <div class="card" id="formContainer">
                <div class="card-header">
                    <div class="card-header-icon">✍️</div>
                    <h2 id="formTitle">Cadastrar Professor</h2>
                </div>
                <form id="professorForm">
                    <input type="hidden" id="editId">

                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required placeholder="Ex: João Silva">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="Ex: joao@teste.com">
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF (Apenas números)</label>
                        <input type="text" id="cpf" required maxlength="11" placeholder="Ex: 12345678919">
                    </div>
                    <button type="submit" id="btnSubmit" class="btn btn-primary">Salvar Professor</button>
                    <button type="button" id="btnCancelEdit" class="btn btn-cancel" style="display: none;"
                        onclick="cancelarEdicao()">Cancelar Edição</button>
                </form>
            </div>

            <!-- Formulário de Busca por ID (GET /{id}) -->
            <div class="card">
                <div class="card-header">
                    <div class="card-header-icon">🔍</div>
                    <h2>Buscar por ID</h2>
                </div>
                <form id="buscaForm">
                    <div class="form-group">
                        <label for="buscaId">ID do Professor</label>
                        <input type="number" id="buscaId" required placeholder="Ex: 1">
                    </div>
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </form>
                <div id="resultadoBusca" class="resultado-busca"></div>
            </div>
        </div>

        <!-- Lista de Professores (GET, DELETE e acionador de EDIT) -->
        <div class="list-section">
            <h2>Professores Cadastrados</h2>
            <div id="listaProfessores"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/professor';
        const form = document.getElementById('professorForm');
        const formTitle = document.getElementById('formTitle');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnCancelEdit = document.getElementById('btnCancelEdit');
        const editIdInput = document.getElementById('editId');

        const buscaForm = document.getElementById('buscaForm');
        const resultadoBusca = document.getElementById('resultadoBusca');
        const listaContainer = document.getElementById('listaProfessores');

        // Função para buscar e listar os professores (GET)
        async function listarProfessores() {
            try {
                const response = await fetch(`${API_URL}/listar`);
                if (!response.ok) throw new Error('Erro ao buscar dados');
                const professores = await response.json();

                listaContainer.innerHTML = '';

                if (professores.length === 0) {
                    listaContainer.innerHTML = '<div class="empty-state"><p>Nenhum professor cadastrado até ao momento.</p></div>';
                    return;
                }

                professores.forEach(prof => {
                    const chaves = Object.keys(prof);
                    const chaveId = chaves.find(k => k.toLowerCase() === 'id' || k.toLowerCase().includes('id') || k.toLowerCase().includes('codigo'));
                    const idProf = chaveId ? prof[chaveId] : null;

                    const card = document.createElement('div');
                    card.className = 'professor-card';
                    card.innerHTML = `
                        <div class="professor-info-block">
                            <div class="professor-name">
                                ${prof.nome} 
                                <span class="badge-id">ID: ${idProf || '?'}</span>
                            </div>
                            <div class="professor-details">
                                <span>📧 ${prof.email}</span>
                                <span>🪪 CPF: ${prof.cpf}</span>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-edit" onclick="prepararEdicao('${idProf}', '${prof.nome}', '${prof.email}', '${prof.cpf}')">Editar</button>
                            <button class="btn btn-sm btn-delete" onclick="deletarProfessor('${idProf}')">Excluir</button>
                        </div>
                    `;
                    listaContainer.appendChild(card);
                });
            } catch (error) {
                console.error('Erro:', error);
                listaContainer.innerHTML = '<div class="empty-state"><p style="color: var(--danger);">Erro ao carregar a lista de professores.</p></div>';
            }
        }

        // Função para cadastrar (POST) ou alterar (PUT)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = editIdInput.value;
            const dadosProfessor = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cpf: document.getElementById('cpf').value
            };

            try {
                let response;
                if (id) {
                    // Modo de Edição (PUT /{id})
                    response = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dadosProfessor)
                    });
                } else {
                    // Modo de Cadastro (POST /cadastrar)
                    response = await fetch(`${API_URL}/cadastrar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dadosProfessor)
                    });
                }

                const resultado = await response.json();

                if (response.status === 201 || response.status === 200) {
                    alert(resultado.mensagem || (id ? 'Professor alterado com sucesso!' : 'Professor cadastrado com sucesso!'));
                    cancelarEdicao();
                    listarProfessores();
                } else if (response.status === 404) {
                    alert(resultado.mensagem || 'Professor não existe.');
                } else {
                    alert('Erro ao processar a requisição.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Não foi possível conectar à API.');
            }
        });

        // Prepara o formulário para edição (PUT)
        function prepararEdicao(id, nome, email, cpf) {
            editIdInput.value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('email').value = email;
            document.getElementById('cpf').value = cpf;

            formTitle.textContent = `Editar Professor (#${id})`;
            btnSubmit.textContent = 'Atualizar Professor';
            btnCancelEdit.style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Cancela o modo de edição e reseta o formulário para cadastro (POST)
        function cancelarEdicao() {
            editIdInput.value = '';
            form.reset();
            formTitle.textContent = 'Cadastrar Professor';
            btnSubmit.textContent = 'Salvar Professor';
            btnCancelEdit.style.display = 'none';
        }

        // Função para buscar professor por ID (GET /{id})
        buscaForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('buscaId').value;
            resultadoBusca.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/${id}`);
                const data = await response.json();

                if (response.status === 200) {
                    resultadoBusca.innerHTML = `
                        <div class="professor-card" style="margin-top: 0.5rem;">
                            <div class="professor-info-block">
                                <div class="professor-name">
                                    ${data.nome} 
                                    <span class="badge-id">ID: ${data.id || id}</span>
                                </div>
                                <div class="professor-details">
                                    <span>📧 ${data.email}</span>
                                    <span>🪪 CPF: ${data.cpf}</span>
                                </div>
                            </div>
                            <button class="btn btn-sm btn-edit" onclick="prepararEdicao('${data.id || id}', '${data.nome}', '${data.email}', '${data.cpf}')">Editar</button>
                        </div>
                    `;
                } else if (response.status === 404) {
                    resultadoBusca.innerHTML = `<p style="color: var(--danger); font-size: 0.9rem;">${data.mensagem || 'Professor não existe'}</p>`;
                } else {
                    resultadoBusca.innerHTML = '<p style="color: var(--danger); font-size: 0.9rem;">Erro ao buscar professor.</p>';
                }
            } catch (error) {
                console.error('Erro:', error);
                resultadoBusca.innerHTML = '<p style="color: var(--danger); font-size: 0.9rem;">Não foi possível conectar à API.</p>';
            }
        });

        // Função para deletar professor por ID (DELETE)
        async function deletarProfessor(id) {
            if (!id || id === 'null' || id === 'undefined') {
                alert('Não foi possível identificar o ID deste professor no banco de dados.');
                return;
            }

            if (!confirm(`Tem certeza que deseja excluir o professor com ID ${id}?`)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const resultado = await response.json();

                if (response.status === 200) {
                    alert(resultado.mensagem || 'Professor excluído com sucesso!');
                    listarProfessores();
                } else if (response.status === 404) {
                    alert(resultado.mensagem || 'Professor não encontrado.');
                } else {
                    alert('Erro ao excluir professor.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Não foi possível conectar à API.');
            }
        }

        // Carrega a lista assim que a página abre
        listarProfessores();
    </script>
</body>

</html>
