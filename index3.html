<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #666;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .sucesso {
            background-color: #d4edda;
            color: #155724;
        }

        .erro {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Cadastrar Aluno</h2>
        <form id="formAluno">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Ex: Henrique Bastos">
            </div>
            <div class="form-group">
                <label for="cpf">CPF (somente números):</label>
                <input type="text" id="cpf" required pattern="\d{11}" placeholder="Ex: 54789632147">
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="Ex: henrique@email.com">
            </div>
            <div class="form-group">
                <label for="dataNasc">Data de Nascimento:</label>
                <input type="date" id="dataNasc" required>
            </div>
            <div class="form-group">
                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura" step="0.01" required placeholder="Ex: 1.80">
            </div>
            <div class="form-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" required placeholder="Ex: 80">
            </div>
            <div class="form-group">
                <label for="tel">Telefone (opcional):</label>
                <input type="text" id="tel" placeholder="Ex: 11999999999">
            </div>
            <button type="submit">Cadastrar</button>
        </form>
        <div id="mensagem"></div>
    </div>

    <script>
        document.getElementById('formAluno').addEventListener('submit', async function (event) {
            event.preventDefault();

            const url = 'http://192.168.206.100:8080/alunos/cadastrar';
            const msgDiv = document.getElementById('mensagem');

            // Formata a data para o padrão ISO com timezone (Z) baseado no que você enviou
            const dataInput = document.getElementById('dataNasc').value;
            const dataFormatada = dataInput ? new Date(dataInput + 'T03:00:00.000Z').toISOString() : null;

            // Monta o objeto exatamente com as chaves fornecidas no seu exemplo
            const dadosAluno = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                dataNasc: dataFormatada,
                altura: parseFloat(document.getElementById('altura').value),
                peso: parseFloat(document.getElementById('peso').value),
                tel: document.getElementById('tel').value || null
                // O "idAluno" geralmente é gerado pelo banco de dados, então foi omitido aqui
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dadosAluno)
                });

                if (response.ok) {
                    msgDiv.className = 'sucesso';
                    msgDiv.textContent = 'Aluno cadastrado com sucesso!';
                    msgDiv.style.display = 'block';
                    document.getElementById('formAluno').reset();
                } else {
                    throw new Error('Erro na resposta do servidor');
                }
            } catch (error) {
                msgDiv.className = 'erro';
                msgDiv.textContent = 'Erro ao conectar ou cadastrar: ' + error.message;
                msgDiv.style.display = 'block';
            }
        });
    </script>

</body>

</html>
